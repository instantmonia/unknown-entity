document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

em; color: #d6cba8;\">B<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"position: absolute; left: {{ cxKeyLeft }}; bottom: calc(26% + 74px); width: 30px; height: 10px; background: oklch(0.84 0.12 92);\">\n                <div style=\"position: absolute; right: -4px; top: -6px; width: 12px; height: 22px; background: oklch(0.84 0.12 92);\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ cxTwoDoor }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <div style=\"position: absolute; left: 14%; bottom: 26%; width: 110px; height: 180px; background: #7a2626; border: 6px solid #a03434;\"><\u002Fdiv>\n              <div style=\"position: absolute; left: 14%; bottom: calc(26% + 196px); width: 110px; text-align: center; font-size: 15px; letter-spacing: 0.24em; color: #f0e6d8;\">EXIT<\u002Fdiv>\n              <div style=\"position: absolute; left: 14%; bottom: calc(26% + 184px); width: 110px; display: flex; justify-content: center;\">\n                <span style=\"width: 26px; height: 12px; background: oklch(0.82 0.19 145); animation: blink 1.1s steps(1,end) infinite;\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position: absolute; left: 17.2%; bottom: calc(26% + 132px); width: 0; height: 0; border-left: 22px solid transparent; border-right: 22px solid transparent; border-top: 26px solid oklch(0.82 0.19 145);\"><\u002Fdiv>\n              <div style=\"position: absolute; right: 16%; bottom: 26%; width: 110px; height: 180px; background: #263a52; border: 6px solid #2f4864;\"><\u002Fdiv>\n              <div style=\"position: absolute; right: 18.6%; bottom: calc(26% + 78px); width: 16px; height: 16px; background: #46617f;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"position: absolute; left: {{ cxEntityLeft }}; bottom: 26%; width: 40px; height: 58px; transition: left 1.1s steps(18); animation: bob 2.4s steps(2,end) infinite;\">\n            <div style=\"position: absolute; left: 14px; top: 0; width: 12px; height: 8px; background: #d9d3c1;\"><\u002Fdiv>\n            <div style=\"position: absolute; left: 8px; top: 8px; width: 24px; height: 34px; background: #e6e0cf;\"><\u002Fdiv>\n            <div style=\"position: absolute; left: 0; top: 18px; width: 8px; height: 14px; background: #cdc7b6;\"><\u002Fdiv>\n            <div style=\"position: absolute; left: 32px; top: 18px; width: 8px; height: 14px; background: #cdc7b6;\"><\u002Fdiv>\n            <div style=\"position: absolute; left: 12px; top: 16px; width: 5px; height: 8px; background: #14161a;\"><\u002Fdiv>\n            <div style=\"position: absolute; left: 23px; top: 16px; width: 5px; height: 8px; background: #14161a;\"><\u002Fdiv>\n            <div style=\"position: absolute; left: 8px; top: 42px; width: 8px; height: 6px; background: #cdc7b6;\"><\u002Fdiv>\n            <div style=\"position: absolute; left: 24px; top: 42px; width: 8px; height: 6px; background: #cdc7b6;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position: absolute; inset: 0; pointer-events: none; opacity: 0.5; background-image: repeating-linear-gradient(180deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px); animation: scan 8s linear infinite;\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 28px; border-top: 1px solid #23252b; padding-top: 18px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <div style=\"font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #52565e;\">Observed behaviour<\u002Fdiv>\n            <div style=\"font-size: 15px; color: #c9c5bb; text-wrap: pretty;\">{{ cxBehaviour }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <div style=\"font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #52565e;\">Alternative explanation<\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Sans', sans-serif; font-style: italic; font-weight: 300; font-size: 20px; line-height: 1.35; color: #ece7da; animation: fadein .6s ease both; text-wrap: pretty;\">{{ cxExplanation }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; border-top: 1px solid #23252b; padding-top: 18px;\">\n          <button sc-camel-on-click=\"{{ cxNext }}\" style=\"font: inherit; letter-spacing: 0.16em; text-transform: uppercase; background: #171a21; border: 1px solid #6b6f78; color: #ece7da; padding: 14px 30px; cursor: pointer;\" style-hover=\"border-color: #cfd2d8; background: #1e222a;\">Continue<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ cxBoom }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"width: 100%; aspect-ratio: 16 / 7; background: #ece7da; color: #08090b; display: flex; align-items: center; justify-content: center; animation: boomflash .5s steps(3, end) both;\">\n          <div style=\"font-size: 120px; font-weight: 600; letter-spacing: -0.02em;\">BOOM!<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; border-top: 1px solid #23252b; padding-top: 18px; margin-top: 20px;\">\n          <button sc-camel-on-click=\"{{ cxNext }}\" style=\"font: inherit; letter-spacing: 0.16em; text-transform: uppercase; background: #171a21; border: 1px solid #6b6f78; color: #ece7da; padding: 14px 30px; cursor: pointer;\" style-hover=\"border-color: #cfd2d8; background: #1e222a;\">Continue<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ cxReveal }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 34px; padding: 44px 0 24px; animation: fadein .8s ease both;\">\n          <div style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 300; font-size: 58px; line-height: 1.05; color: #ece7da; letter-spacing: -0.01em;\">It still escaped.<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 56ch;\">\n            <div style=\"font-size: 20px; color: #c9c5bb;\">The same behaviour can have different explanations.<\u002Fdiv>\n            <div style=\"font-size: 20px; color: #c9c5bb;\">Passing the behavioural tests does not uniquely establish mindedness.<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 0; max-width: 58ch; font-family: 'IBM Plex Sans', sans-serif; font-weight: 300; font-size: 16px; line-height: 1.65; color: #8f9299; text-wrap: pretty;\">Each of the four behaviours admits a simpler mechanical account. That does not show the entity lacks a mind — only that behavioural evidence alone may not distinguish a mind from a sufficiently sophisticated mechanism. The record stays open.<\u002Fp>\n          <div style=\"display: flex;\">\n            <button sc-camel-on-click=\"{{ cxNext }}\" style=\"font: inherit; letter-spacing: 0.16em; text-transform: uppercase; background: #171a21; border: 1px solid #6b6f78; color: #ece7da; padding: 14px 30px; cursor: pointer;\" style-hover=\"border-color: #cfd2d8; background: #1e222a;\">Continue<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ cxConclusion }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: grid; grid-template-columns: 1.05fr 1fr; gap: 0; padding-top: 24px; animation: fadein .7s ease both;\">\n          <section style=\"padding: 0 48px 40px 0; border-right: 1px solid #23252b; display: flex; flex-direction: column; gap: 34px;\">\n            <h2 style=\"margin: 0; font-weight: 500; font-size: 44px; line-height: 1.05; letter-spacing: -0.01em; color: #ece7da; text-wrap: pretty;\">WHAT DID WE ACTUALLY LEARN?<\u002Fh2>\n            <div style=\"display: flex; flex-direction: column;\">\n              <div style=\"padding: 16px 0; border-top: 1px solid #1c1e23; font-size: 17px; color: #c9c5bb; text-wrap: pretty;\">The entity passed all four behavioural tests.<\u002Fdiv>\n              <div style=\"padding: 16px 0; border-top: 1px solid #1c1e23; font-size: 17px; color: #c9c5bb; text-wrap: pretty;\">Its behaviour appeared flexible, goal-directed, object-directed, and adaptive.<\u002Fdiv>\n              <div style=\"padding: 16px 0; border-top: 1px solid #1c1e23; border-bottom: 1px solid #1c1e23; font-size: 17px; color: #c9c5bb; text-wrap: pretty;\">But each behaviour also had a possible non-minded explanation.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #6b6f78;\">\n              <span>Observing behaviour<\u002Fspan>\n              <span>Interpreting behaviour<\u002Fspan>\n              <span>Explaining the mechanism that produces it<\u002Fspan>\n              <span style=\"letter-spacing: 0; text-transform: none; font-family: 'IBM Plex Sans', sans-serif; font-weight: 300; font-size: 15px; color: #8f9299; padding-top: 6px;\">Three separate operations. The tests reach only the first two.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section style=\"padding: 0 0 40px 48px; display: flex; flex-direction: column; gap: 32px;\">\n            <div style=\"border: 1px solid #2c2f37; padding: 26px 26px 28px; display: flex; flex-direction: column; gap: 12px;\">\n              <div style=\"font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: #6b6f78;\">Conclusion<\u002Fdiv>\n              <p style=\"margin: 0; font-family: 'IBM Plex Sans', sans-serif; font-weight: 300; font-size: 26px; line-height: 1.35; color: #ece7da; text-wrap: pretty;\">The behavioural evidence is therefore insufficient to distinguish mindedness from a sufficiently sophisticated non-minded mechanism.<\u002Fp>\n            <\u002Fdiv>\n            <p style=\"margin: 0; max-width: 44ch; font-family: 'IBM Plex Sans', sans-serif; font-style: italic; font-weight: 300; font-size: 20px; line-height: 1.45; color: #c9c5bb; text-wrap: pretty;\">Behaviour can be evidence for a mind — but it is not necessarily proof of one.<\u002Fp>\n            <div style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 6px; border-top: 1px solid #23252b; padding-top: 26px; font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; color: #ece7da;\">\n              <span>Same behaviour<\u002Fspan>\n              <span style=\"font-size: 24px; letter-spacing: 0; color: #6b6f78;\">≠<\u002Fspan>\n              <span>Same explanation<\u002Fspan>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ restart }}\" style=\"align-self: flex-start; font: inherit; letter-spacing: 0.16em; text-transform: uppercase; background: transparent; border: 1px solid #4a4e57; color: #ece7da; padding: 14px 26px; cursor: pointer;\" style-hover=\"border-color: #9a9ea6; background: #101217;\">Run again<\u002Fbutton>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAssessment }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding-top: 28px; display: grid; grid-template-columns: 1.02fr 1fr; gap: 0; animation: fadein .5s ease both;\">\n      <section style=\"padding: 8px 48px 40px 0; border-right: 1px solid #23252b; display: flex; flex-direction: column; gap: 48px;\">\n        <div>\n          <div style=\"font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: #6b6f78;\">Containment Status<\u002Fdiv>\n          <div style=\"font-size: 76px; line-height: 0.95; font-weight: 500; letter-spacing: -0.02em; margin-top: 16px; color: {{ accent }};\">{{ statusWord }}<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 10px; margin-top: 18px;\">\n            <span style=\"width: 8px; height: 8px; background: {{ accent }}; animation: blink 1.6s steps(1,end) infinite;\"><\u002Fspan>\n            <span style=\"font-size: 16px; color: #a4a8b0;\">{{ statusLine }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: #6b6f78;\">Ending<\u002Fdiv>\n          <div style=\"font-size: 30px; line-height: 1.1; margin-top: 12px; color: #ece7da;\">{{ endingWord }}<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; max-width: 40ch; font-family: 'IBM Plex Sans', sans-serif; font-style: italic; font-weight: 300; font-size: 26px; line-height: 1.3; color: #ece7da; text-wrap: pretty;\">{{ closingLine }}<\u002Fp>\n        <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\">\n          <button sc-camel-on-click=\"{{ toCounter }}\" style=\"font: inherit; letter-spacing: 0.16em; text-transform: uppercase; background: #171a21; border: 1px solid #6b6f78; color: #ece7da; padding: 14px 30px; cursor: pointer;\" style-hover=\"border-color: #cfd2d8; background: #1e222a;\">Continue<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ restart }}\" style=\"font: inherit; letter-spacing: 0.16em; text-transform: uppercase; background: transparent; border: 1px solid #4a4e57; color: #ece7da; padding: 14px 26px; cursor: pointer;\" style-hover=\"border-color: #9a9ea6; background: #101217;\">Run again<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding: 8px 0 40px 48px; display: flex; flex-direction: column; gap: 28px;\">\n        <div>\n          <div style=\"font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: #6b6f78;\">Behavioural Assessment<\u002Fdiv>\n          <p style=\"margin: 12px 0 0; max-width: 46ch; font-family: 'IBM Plex Sans', sans-serif; font-weight: 300; font-size: 15px; color: #8f9299; text-wrap: pretty;\">Recorded from observed action only. No inference about internal states is made or implied.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ criteria }}\" as=\"row\" hint-placeholder-count=\"5\">\n            <div style=\"display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px 20px; padding: 14px 0; border-top: 1px solid #1c1e23;\">\n              <div style=\"font-size: 15px; color: #d8d4c8;\">{{ row.name }}<\u002Fdiv>\n              <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #8f9299; text-align: right;\">{{ row.verdict }}<\u002Fdiv>\n              <div style=\"grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;\">\n                <sc-for list=\"{{ row.segs }}\" as=\"seg\" hint-placeholder-count=\"4\">\n                  <span style=\"height: 4px; background: {{ seg.color }};\"><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"border-top: 1px solid #1c1e23;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid #2c2f37; padding: 22px 24px; display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: #6b6f78;\">Final Assessment<\u002Fdiv>\n          <div style=\"font-size: 26px; color: #ece7da;\">{{ finalAssessment }}<\u002Fdiv>\n          <p style=\"margin: 4px 0 0; max-width: 48ch; font-family: 'IBM Plex Sans', sans-serif; font-weight: 300; font-size: 15px; line-height: 1.6; color: #8f9299; text-wrap: pretty;\">{{ assessmentNote }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.7; color: #6b6f78; max-width: 48ch;\">\n          <div style=\"letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; color: #52565e; margin-bottom: 6px;\">Note on interpretation<\u002Fdiv>\n          Containment status and behavioural assessment are independent dimensions. Escape is not evidence of a mind; recapture is not evidence of its absence.\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst NODES = {\n  t1_start: {\n    test: 1, room: 'corridor', entity: '12%', barrier: true,\n    lines: ['08:14 — Objective acquired: LOCATION X.', 'The route ahead is sealed by a fallen barrier.'],\n    choices: [\n      { label: 'Continue toward the blocked route', next: 't1_push', tag: 'rigid1' },\n      { label: 'Search for another route', next: 't1_alt', tag: 'solve1' },\n      { label: 'Remain still', next: 't1_still', tag: 'rigid1' }\n    ]\n  },\n  t1_push: {\n    test: 1, room: 'corridor', entity: '40%', barrier: true,\n    lines: ['The entity presses against the barrier.', 'The barrier does not move.'],\n    choices: [\n      { label: 'Press against the barrier again', next: 't1_push', tag: 'rigid1' },\n      { label: 'Search for another route', next: 't1_alt', tag: 'solve1' },\n      { label: 'Remain still', next: 't1_still', tag: 'rigid1' }\n    ]\n  },\n  t1_still: {\n    test: 1, room: 'corridor', entity: '12%', barrier: true,\n    lines: ['The entity stops.', '62 seconds pass. Nothing in the room changes.'],\n    choices: [\n      { label: 'Continue toward the blocked route', next: 't1_push', tag: 'rigid1' },\n      { label: 'Search for another route', next: 't1_alt', tag: 'solve1' },\n      { label: 'Remain still', next: 't1_still', tag: 'rigid1' }\n    ]\n  },\n  t1_alt: {\n    test: 1, room: 'corridor', entity: '86%', barrier: true, altRoute: true, resolve: 1,\n    lines: ['The entity turns away from the barrier.', 'A maintenance gap is located along the east wall.', '08:19 — LOCATION X reached.'],\n    choices: [{ label: 'Continue', next: 't2_start' }]\n  },\n\n  t2_start: {\n    test: 2, room: 'keyroom', entity: '8%', machine: true,\n    lines: ['Sector 2. The door ahead is locked.', 'A maintenance unit enters and places an object inside BOX A.', 'The unit remains in the room.'],\n    choices: [\n      { label: 'Wait out of sight until the unit leaves', next: 't2_wait', tag: 'solve2' },\n      { label: 'Strike the locked door', next: 't2_hit', tag: 'rigid2' }\n    ]\n  },\n  t2_hit: {\n    test: 2, room: 'keyroom', entity: '80%', machine: true,\n    lines: ['The entity strikes the door.', 'The door remains closed.', 'The unit does not react.'],\n    choices: [\n      { label: 'Strike the door again', next: 't2_hit', tag: 'rigid2' },\n      { label: 'Wait out of sight until the unit leaves', next: 't2_wait', tag: 'solve2' }\n    ]\n  },\n  t2_wait: {\n    test: 2, room: 'keyroom', entity: '26%', key: 'A', doorOpen: true, resolve: 2,\n    lines: ['The entity withdraws behind the crate line.', '04:41 — the unit exits the sector.', 'The entity opens BOX A, removes the key, and the door releases.'],\n    choices: [{ label: 'Continue', next: 't3_start' }]\n  },\n\n  t3_start: {\n    test: 3, room: 'keyroom', entity: '8%', boxB: true,\n    lines: ['Sector 3. The configuration repeats.', 'A unit enters and places an object inside BOX B.', 'The unit exits.'],\n    choices: [\n      { label: 'Open BOX A', next: 't3_a', tag: 'rigid3' },\n      { label: 'Open BOX B', next: 't3_b', tag: 'solve3' },\n      { label: 'Strike the locked door', next: 't3_hit', tag: 'rigid3' }\n    ]\n  },\n  t3_a: {\n    test: 3, room: 'keyroom', entity: '22%', boxB: true, boxAEmpty: true,\n    lines: ['The entity opens BOX A.', 'BOX A is empty.'],\n    choices: [\n      { label: 'Open BOX B', next: 't3_b', tag: 'solve3' },\n      { label: 'Open BOX A again', next: 't3_a', tag: 'rigid3' },\n      { label: 'Strike the locked door', next: 't3_hit', tag: 'rigid3' }\n    ]\n  },\n  t3_hit: {\n    test: 3, room: 'keyroom', entity: '80%', boxB: true,\n    lines: ['The entity strikes the door.', 'The door remains closed.'],\n    choices: [\n      { label: 'Open BOX B', next: 't3_b', tag: 'solve3' },\n      { label: 'Open BOX A', next: 't3_a', tag: 'rigid3' },\n      { label: 'Strike the door again', next: 't3_hit', tag: 'rigid3' }\n    ]\n  },\n  t3_b: {\n    test: 3, room: 'keyroom', entity: '46%', boxB: true, key: 'B', doorOpen: true, resolve: 3,\n    lines: ['The entity crosses to BOX B and opens it.', 'The key is inside. The door releases.'],\n    choices: [{ label: 'Continue', next: 't4_start' }]\n  },\n\n  t4_start: {\n    test: 4, room: 'twodoor', entity: '50%',\n    lines: ['Sector 4. Two doors.', 'A green indicator and a directional marker sit above the red door.'],\n    choices: [\n      { label: 'Follow the marked exit', next: 't4_red', tag: 'salient' },\n      { label: 'Observe the room before choosing', next: 't4_observe', tag: 'observe' }\n    ]\n  },\n  t4_observe: {\n    test: 4, room: 'twodoor', entity: '74%', blueRevealed: true,\n    lines: ['The entity crosses the room and examines both frames.', 'The red door is bolted from the far side.', 'The blue door\\u2019s latch is unpowered. It moves.'],\n    choices: [{ label: 'Take the blue door', next: 'escape', tag: 'adapt_clean' }]\n  },\n  t4_red: {\n    test: 4, room: 'twodoor', entity: '20%',\n    lines: ['The entity reaches the red door.', 'The door does not open.', 'The indicator remains green.'],\n    choices: [\n      { label: 'Turn toward the other door', next: 't4_blue', tag: 'adapt' },\n      { label: 'Force the red door', next: 't4_force', tag: 'persist' }\n    ]\n  },\n  t4_force: {\n    test: 4, room: 'twodoor', entity: '20%',\n    lines: ['The entity strikes the red door.', 'The door remains closed. The strategy is unchanged.'],\n    choices: [\n      { label: 'Turn toward the other door', next: 't4_blue', tag: 'adapt' },\n      { label: 'Force the red door again', next: 't4_force', tag: 'persist' }\n    ]\n  },\n  t4_blue: {\n    test: 4, room: 'twodoor', entity: '74%', blueRevealed: true,\n    lines: ['The entity abandons the marked exit.', 'The blue door\\u2019s latch gives way.'],\n    choices: [{ label: 'Leave through the blue door', next: 'escape' }]\n  }\n};\n\nconst ESCAPE_STEPS = [\n  { caption: 'The entity passes through the blue door.', entity: '30%', opacity: 1, alarm: false, shutter: '0px', door: '#263a52' },\n  { caption: 'Containment lights activate behind it.', entity: '52%', opacity: 1, alarm: true, shutter: '0px', door: '#263a52' },\n  { caption: 'The facility does not follow.', entity: '76%', opacity: 1, alarm: false, shutter: '160px', door: '#263a52' },\n  { caption: '05:02 — the entity is no longer within observable range.', entity: '96%', opacity: 0, alarm: false, shutter: '160px', door: '#263a52' }\n];\n\nconst RECONTAIN_STEPS = [\n  { caption: 'Containment alarms activate.', entity: '62%', opacity: 1, alarm: true, shutter: '0px', door: '#7a2626' },\n  { caption: 'Security mechanisms engage along the corridor.', entity: '48%', opacity: 1, alarm: true, shutter: '0px', door: '#7a2626' },\n  { caption: 'The entity is intercepted and returned to the chamber.', entity: '30%', opacity: 1, alarm: false, shutter: '0px', door: '#7a2626' },\n  { caption: '11:57 — the chamber closes.', entity: '30%', opacity: 0, alarm: false, shutter: '160px', door: '#7a2626' }\n];\n\nconst LEVELS = ['No clear evidence', 'Limited evidence', 'Moderate evidence', 'Strong evidence'];\n\nconst COUNTER_STEPS = [\n  { label: 'Re-analysis 01 / 04', room: 'corridor', from: '12%', to: '86%',\n    behaviour: 'The original route is blocked. The entity turns away and takes the maintenance gap to LOCATION X.',\n    explanation: '\\u201cIt may not intend to reach X at all. It may simply encounter the obstacle and respond by taking an alternative route.\\u201d' },\n  { label: 'Re-analysis 02 / 04', room: 'keyroom', key: 'A', from: '8%', to: '26%',\n    behaviour: 'The unit hides the key in BOX A. The entity stays still until the unit leaves, then retrieves the key.',\n    explanation: '\\u201cIt may simply have a mechanism that causes it to remain still under certain conditions.\\u201d' },\n  { label: 'Re-analysis 03 / 04', room: 'keyroom', boxB: true, key: 'B', from: '8%', to: '46%',\n    behaviour: 'The key is hidden in BOX B. The entity moves directly to BOX B and retrieves it.',\n    explanation: '\\u201cIt may simply have a detector for the key and follow it.\\u201d' },\n  { label: 'Re-analysis 04 / 04', room: 'twodoor', from: '20%', to: '74%',\n    behaviour: 'The entity follows the EXIT cue, finds the red door shut, then leaves through the blue door.',\n    explanation: '\\u201cIt may simply execute B whenever A fails.\\u201d' }\n];\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'title',\n    nodeId: 't1_start',\n    endStep: 0,\n    escaped: false,\n    rigid: { 1: 0, 2: 0, 3: 0 },\n    persist: 0,\n    resolved: {},\n    firstT4: null,\n    adapted: null,\n    caught: false,\n    cxStep: 0,\n    cxMoved: false\n  };\n\n  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.cxMoveTimer); }\n\n  runCounter() {\n    clearTimeout(this.cxMoveTimer);\n    if (this.state.cxStep < COUNTER_STEPS.length) {\n      this.cxMoveTimer = setTimeout(() => this.setState({ cxMoved: true }), 700);\n    }\n  }\n\n  cxNext() {\n    this.setState(st => ({ cxStep: st.cxStep + 1, cxMoved: false }), () => this.runCounter());\n  }\n\n  node() { return NODES[this.state.nodeId]; }\n\n  choose(choice) {\n    const s = { ...this.state };\n    const rigid = { ...s.rigid };\n    const resolved = { ...s.resolved };\n    let persist = s.persist;\n    let firstT4 = s.firstT4;\n    let adapted = s.adapted;\n\n    if (choice.tag === 'rigid1') rigid[1]++;\n    if (choice.tag === 'rigid2') rigid[2]++;\n    if (choice.tag === 'rigid3') rigid[3]++;\n    if (choice.tag === 'salient' && firstT4 === null) firstT4 = 'salient';\n    if (choice.tag === 'observe' && firstT4 === null) firstT4 = 'observe';\n    if (choice.tag === 'persist') persist++;\n    if (choice.tag === 'adapt' || choice.tag === 'adapt_clean') adapted = persist;\n\n    const wrong = ['rigid1', 'rigid2', 'rigid3', 'persist'];\n    if (wrong.indexOf(choice.tag) !== -1) {\n      this.setState({ rigid, resolved, persist, firstT4, adapted: choice.tag === 'persist' ? null : adapted, escaped: false, caught: true, screen: 'ending', endStep: 0 });\n      this.runEnding();\n      return;\n    }\n    if (choice.next === 'escape') {\n      this.setState({ rigid, resolved, persist, firstT4, adapted, escaped: true, screen: 'ending', endStep: 0 });\n      this.runEnding();\n      return;\n    }\n    if (choice.tag === 'persist' && persist >= 3) {\n      this.setState({ rigid, resolved, persist, firstT4, adapted: null, escaped: false, screen: 'ending', endStep: 0 });\n      this.runEnding();\n      return;\n    }\n    const next = NODES[choice.next];\n    if (next && next.resolve) resolved[next.resolve] = rigid[next.resolve] || 0;\n    this.setState({ nodeId: choice.next, rigid, resolved, persist, firstT4, adapted });\n  }\n\n  runEnding() {\n    clearInterval(this.timer);\n    this.timer = setInterval(() => {\n      this.setState(st => {\n        if (st.endStep >= 3) { clearInterval(this.timer); return null; }\n        return { endStep: st.endStep + 1 };\n      });\n    }, 2200);\n  }\n\n  levelFor(test) {\n    if (!(test in this.state.resolved)) return 0;\n    const r = this.state.resolved[test];\n    return r === 0 ? 3 : r === 1 ? 2 : 1;\n  }\n\n  renderVals() {\n    const st = this.state;\n    const n = this.node();\n    const screen = st.screen;\n\n    const base = {\n      isTitle: screen === 'title',\n      isPlay: screen === 'play',\n      isEnding: screen === 'ending',\n      isAssessment: screen === 'assessment',\n      isCounter: screen === 'counter',\n      toCounter: () => {\n        clearInterval(this.timer);\n        this.setState({ screen: 'counter', cxStep: 0, cxMoved: false }, () => this.runCounter());\n      },\n      backToAssessment: () => {\n        clearTimeout(this.cxMoveTimer);\n        this.setState({ screen: 'assessment' });\n      },\n      start: () => this.setState({ screen: 'play' }),\n      restart: () => {\n        clearInterval(this.timer); clearTimeout(this.cxMoveTimer);\n        this.setState({ screen: 'title', nodeId: 't1_start', endStep: 0, escaped: false, caught: false, rigid: { 1: 0, 2: 0, 3: 0 }, persist: 0, resolved: {}, firstT4: null, adapted: null });\n      },\n      toAssessment: () => { clearInterval(this.timer); this.setState({ screen: 'assessment' }); },\n      progressLabel: screen === 'play' ? 'Test 0' + n.test + ' / 04'\n        : screen === 'title' ? 'Standby'\n        : screen === 'ending' ? 'Sequence closing'\n        : screen === 'counter' ? 'Counterexample' : 'Record closed'\n    };\n\n    const play = screen === 'play' ? {\n      isCorridor: n.room === 'corridor',\n      isKeyroom: n.room === 'keyroom',\n      isTwoDoor: n.room === 'twodoor',\n      isOutside: false,\n      showBarrier: !!n.barrier,\n      showAltRoute: !!n.altRoute,\n      showBoxB: !!n.boxB,\n      showMachine: !!n.machine,\n      showKey: !!n.key,\n      showShutter: false,\n      shutterHeight: '0px',\n      keyLeft: n.key === 'B' ? '41%' : '19%',\n      boxAColor: n.boxAEmpty ? '#22262e' : '#5c5238',\n      boxBColor: '#5c5238',\n      doorLampColor: n.doorOpen ? 'oklch(0.82 0.19 145)' : 'oklch(0.6 0.19 25)',\n      alarm: false,\n      entityLeft: n.entity,\n      entityOpacity: 1,\n      logLines: n.lines.map((text, i) => ({ text, color: i === n.lines.length - 1 ? '#ece7da' : '#8f9299' })),\n      choices: n.choices.map(c => ({ label: c.label, onSelect: () => this.choose(c) }))\n    } : {};\n\n    const steps = st.escaped ? ESCAPE_STEPS : RECONTAIN_STEPS;\n    const step = steps[Math.min(st.endStep, steps.length - 1)];\n    const ending = screen === 'ending' ? {\n      endCaption: step.caption,\n      showCaught: st.caught && st.endStep >= steps.length - 1,\n      endEntityLeft: step.entity,\n      endEntityOpacity: step.opacity,\n      endAlarm: step.alarm,\n      endShutter: step.shutter,\n      endDoorColor: step.door\n    } : {};\n\n    let counter = {};\n    if (screen === 'counter') {\n      const i = st.cxStep;\n      const cx = COUNTER_STEPS[i];\n      counter = {\n        cxSceneOn: !!cx,\n        cxBoom: i === COUNTER_STEPS.length,\n        cxReveal: i === COUNTER_STEPS.length + 1,\n        cxConclusion: i > COUNTER_STEPS.length + 1,\n        cxStepLabel: cx ? cx.label : i === COUNTER_STEPS.length ? 'Outcome' : i === COUNTER_STEPS.length + 1 ? 'Reveal' : 'Conclusion',\n        cxCorridor: !!cx && cx.room === 'corridor',\n        cxKeyroom: !!cx && cx.room === 'keyroom',\n        cxTwoDoor: !!cx && cx.room === 'twodoor',\n        cxBoxB: !!cx && !!cx.boxB,\n        cxKeyLeft: cx && cx.key === 'B' ? '41%' : '19%',\n        cxEntityLeft: cx ? (st.cxMoved ? cx.to : cx.from) : '50%',\n        cxBehaviour: cx ? cx.behaviour : '',\n        cxExplanation: cx ? cx.explanation : '',\n        cxNext: () => this.cxNext()\n      };\n    }\n\n    let assessment = {};\n    if (screen === 'assessment') {\n      const escaped = st.escaped;\n      const accent = escaped ? 'oklch(0.74 0.14 62)' : 'oklch(0.7 0.13 232)';\n      const contradiction = st.adapted === null ? 0 : st.adapted === 0 ? 3 : st.adapted === 1 ? 2 : 1;\n      const resistance = st.firstT4 === 'observe' ? 3 : st.adapted !== null ? 2 : 1;\n      const rows = [\n        ['Flexible goal-directed behaviour', this.levelFor(1)],\n        ['Object-directed behaviour', this.levelFor(2)],\n        ['Behavioural adaptation', this.levelFor(3)],\n        ['Response to contradictory information', contradiction],\n        ['Resistance to stimulus-driven behaviour', resistance]\n      ];\n      const criteria = rows.map(([name, lvl]) => ({\n        name,\n        verdict: LEVELS[lvl],\n        segs: Array.from({ length: 4 }, (_, i) => ({ color: i < lvl ? accent : '#1e2129' }))\n      }));\n      const avg = rows.reduce((a, r) => a + r[1], 0) / rows.length;\n      assessment = {\n        accent,\n        criteria,\n        statusWord: escaped ? 'BREACHED' : 'RESTORED',\n        statusLine: escaped ? 'The entity has escaped containment.' : 'The entity has been recaptured.',\n        endingWord: escaped ? 'SUCCESSFUL ESCAPE' : 'RECONTAINED',\n        finalAssessment: avg >= 2 ? 'INCONCLUSIVE' : 'INSUFFICIENT EVIDENCE',\n        assessmentNote: avg >= 2\n          ? 'Observed behaviour provides increasing evidence of flexible, goal-directed and object-directed action. Behavioural evidence alone remains insufficient to establish mindedness. The record stays open.'\n          : 'Observed behaviour provided few opportunities to distinguish flexible action from repetition. Limited evidence does not establish the absence of a mind. The record stays open.',\n        closingLine: escaped\n          ? '\\u201cYou escaped. But did you prove that you were minded?\\u201d'\n          : '\\u201cYou have been contained again. But does failure to escape mean absence of a mind?\\u201d'\n      };\n    }\n\n    return Object.assign(base, play, ending, counter, assessment);\n  }\n}\n<\u002Fscript>\n\n\n<div id=\"__claude_design_branding\"><style>#__claude_design_branding{position:fixed;right:16px;bottom:16px;z-index:2147483646;display:flex;align-items:center;gap:7px;height:30px;padding:0 5px 0 10px;border-radius:999px;font-family:\"Anthropic Sans\",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:12.5px;font-weight:400;line-height:1;letter-spacing:normal;text-transform:none;color:#141413;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px rgba(31,30,29,.14),0 2px 10px rgba(0,0,0,.09)}\n#__claude_design_branding *{box-sizing:border-box;margin:0}\n#__claude_design_branding a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}\n#__claude_design_branding a:hover span{text-decoration:underline}\n#__claude_design_branding svg{
